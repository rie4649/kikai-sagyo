<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>機械作業</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14264d">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* 現場用:スマホで片手で押しやすい大きさ。色は前の機械作業アプリと同じ濃紺 */
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#eef1f6;color:#1f2937;font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;padding-bottom:90px;}
button,input,select,textarea{font-family:inherit;}
[hidden]{display:none!important;}
header{background:#14264d;color:#fff;padding:14px 12px 10px;position:sticky;top:0;z-index:50;}
header .row{display:flex;align-items:center;gap:8px;}
header h1{font-size:22px;white-space:nowrap;}
.me{flex:1;min-width:0;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:10px;padding:7px 10px;font-size:14px;font-weight:bold;}
.tabs{display:flex;gap:6px;margin-top:10px;}
.tabs button{flex:1;border:none;border-radius:10px;padding:10px 4px;font-size:15px;font-weight:bold;background:rgba(255,255,255,.12);color:#fff;}
.tabs button.on{background:#fff;color:#14264d;}
.filter{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:14px;}
.filter label{display:flex;align-items:center;gap:6px;}
.filter input{width:20px;height:20px;}
.wrap{max-width:680px;margin:0 auto;padding:12px;}
.wrap.wide{max-width:1400px;}
.wrap.wide .calDay{max-width:680px;margin-left:auto;margin-right:auto;}
.dayHead{font-size:17px;font-weight:900;color:#14264d;margin:16px 4px 6px;display:flex;gap:8px;align-items:center;}
.dayHead .su{color:#dc2626;} .dayHead .sa{color:#1d4ed8;}
.dayHead .today{background:#dc2626;color:#fff;border-radius:6px;padding:1px 8px;font-size:13px;}
/* カレンダー(関根カレンダーの機械作業と同じ形) */
  .kkWrap { overflow-x:auto; background:#fff; border:1px solid #d6d3d1; border-radius:10px; }
  .kkCal { min-width:820px; font-size:12px; color:#111827; }
  .kkTitle { display:none; }
  .kkDow { display:grid; grid-template-columns:repeat(7,1fr); }
  .kkDow div { background:#44403c; color:#fff; text-align:center; font-weight:bold; padding:5px 0; font-size:14px; }
  .kkDow .sa { background:#1d4ed8; } .kkDow .su { background:#dc2626; }
  .kkWeeks { display:flex; flex-direction:column; }
  .kkWeek { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); border-top:2px solid #57534e; min-height:120px; }
  .kkBg { border-right:1px solid #d6d3d1; grid-row:1 / -1; }
  .kkBg:nth-child(7) { border-right:none; }
  .kkBg.out { background:#f0efee; }
  .kkDh { grid-row:1; display:flex; align-items:baseline; gap:6px; padding:2px 8px; cursor:pointer; z-index:1; }
  .kkDh:hover .n { text-decoration:underline; }
  .kkDh .n { font-size:2.1em; font-weight:900; line-height:1.15; }
  .kkDh .h { font-size:1.1em; font-weight:bold; }
  .kkDh.su { background:#fde8e8; color:#dc2626; }
  .kkDh.sa { background:#dbeafe; color:#1d4ed8; }
  .kkDh.out { color:#b5b0ab; background:#f0efee; cursor:default; }
  .kkDh.today .n { text-decoration:underline; text-decoration-thickness:3px; text-underline-offset:3px; }
  .kkFill { grid-column:1 / -1; }
  .kkEv { margin:3px 4px; border:1.5px solid var(--evb); background:var(--evbg); border-radius:4px; padding:3px 7px 4px; z-index:1; cursor:pointer; min-width:0; }
  .kkEv:hover { box-shadow:0 0 0 2px var(--evb); }
  .kkHead { display:flex; flex-wrap:wrap; align-items:center; gap:2px 6px; min-width:0; }
  .kkEv .co { font-weight:900; font-size:1.32em; line-height:1.25; flex:0 1 auto; min-width:0; overflow-wrap:anywhere; }
  .kkEv .tm { font-weight:bold; font-size:1.05em; white-space:nowrap; }
  .kkEv .cont { font-size:.9em; color:#57534e; white-space:nowrap; }
  .kkArrow { flex:1 1 40px; min-width:40px; height:3px; background:#c00000; position:relative; margin-right:9px; }
  .kkArrow::after { content:""; position:absolute; right:-9px; top:50%; transform:translateY(-50%); border-left:11px solid #c00000; border-top:6px solid transparent; border-bottom:6px solid transparent; }
  .kkArrow.open::after { display:none; }
  .kkArrowLbl { color:#c00000; font-weight:bold; font-size:.92em; white-space:nowrap; }
  .kkNights { font-size:.9em; font-weight:bold; border:1px solid var(--evb); border-radius:999px; padding:0 6px; white-space:nowrap; background:rgba(255,255,255,.6); }
  .kkBody { display:grid; grid-template-columns:repeat(var(--n),minmax(0,1fr)); margin-top:1px; }
  .kkBody > div { padding-right:6px; min-width:0; white-space:pre-wrap; overflow-wrap:anywhere; }
  .kkBody > div + div { border-left:1px dashed var(--evb); padding-left:6px; }
  .kkBody .s { color:#57534e; }
  .kkEv.tent { --evb:#7a7f8a; border:2px dashed #7a7f8a; background:repeating-linear-gradient(135deg,#fff 0 8px,#f6f7f9 8px 16px); }
  .kkEv.tent .co { font-size:1.1em; }
  .kkTag { font-size:.85em; font-weight:bold; color:#fff; background:#7a7f8a; border-radius:3px; padding:0 5px; white-space:nowrap; }
  .kkHint { font-size:13px; color:#57534e; margin:8px 2px; }

.calHead{display:flex;align-items:center;justify-content:center;gap:10px;margin:4px 0 8px;}
.calHead b{font-size:20px;min-width:8em;text-align:center;}
.calHead button{border:1px solid #cbd5e1;background:#fff;border-radius:10px;padding:8px 14px;font-size:16px;font-weight:bold;}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:#fff;border:1px solid #cbd5e1;border-radius:12px;overflow:hidden;}
.cal .dw{background:#334155;color:#fff;text-align:center;font-size:12px;font-weight:bold;padding:4px 0;}
.cal .dw.sa{background:#1d4ed8;} .cal .dw.su{background:#dc2626;}
.cal .c{min-height:76px;border-top:1px solid #e2e8f0;border-right:1px solid #e2e8f0;padding:2px 2px 3px;cursor:pointer;min-width:0;}
.cal .c:nth-child(7n){border-right:none;}
.cal .c.out{background:#f1f5f9;color:#94a3b8;}
.cal .c.sel{box-shadow:inset 0 0 0 3px #f59e0b;}
.cal .c.td .n{background:#14264d;color:#fff;border-radius:999px;padding:0 6px;}
.cal .n{font-size:15px;font-weight:900;}
.cal .c.sa .n{color:#1d4ed8;} .cal .c.su .n{color:#dc2626;} .cal .c.td.sa .n,.cal .c.td.su .n{color:#fff;}
.cal .wk{font-size:9px;padding:0 3px;margin-left:2px;}
.cal .e{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:10.5px;font-weight:bold;line-height:1.2;margin-top:2px;padding:1px 2px;border-radius:4px;border-left:3px solid var(--evb);background:var(--evbg);overflow:hidden;word-break:break-all;}
.cal .e.cont{opacity:.7;border-left-style:dotted;}
.cal .e.tent{border:1px dashed #7a7f8a;background:#fff;}
.cal .more{font-size:10px;color:#64748b;}
.calDay{margin-top:12px;}
.instBtn{margin-left:auto;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.12);color:#fff;border-radius:10px;padding:8px 12px;font-size:14px;font-weight:bold;white-space:nowrap;}
.backBtn{border:none;background:#14264d;color:#fff;border-radius:10px;padding:10px 16px;font-size:16px;font-weight:bold;margin:2px 0 10px;}
.outBtns{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:0 0 10px;}
.outBtns button{border:1px solid #cbd5e1;background:#fff;border-radius:10px;padding:8px 12px;font-size:14px;font-weight:bold;}
.outBtns button.x{border-color:#16a34a;color:#15803d;} .outBtns button.p{border-color:#dc2626;color:#b91c1c;}
#pdfArea{position:fixed;left:-30000px;top:0;background:#fff;}
.calHead{flex-wrap:wrap;}
/* 1か月の一覧 */
.mWrap{overflow-x:auto;background:#fff;border:1px solid #cbd5e1;border-radius:12px;}
.mList{width:100%;min-width:760px;border-collapse:collapse;font-size:14px;}
.mList th{background:#334155;color:#fff;padding:6px;text-align:left;white-space:nowrap;position:sticky;top:0;}
.mList td{border-top:1px solid #e2e8f0;padding:6px;vertical-align:top;}
.mList tr.first td{border-top:2px solid #94a3b8;}
.mList tbody tr{cursor:pointer;} .mList tbody tr:hover{background:#f8fafc;}
.mList td.d{white-space:nowrap;font-weight:900;font-size:15px;} .mList td.d.sa{color:#1d4ed8;} .mList td.d.su{color:#dc2626;}
.mList td.co{font-weight:bold;} .mList td.co small{display:block;font-weight:normal;color:#64748b;font-size:12px;}
.mList tr.tent td{color:#64748b;}
.mList.v3 td{border-top:1px solid #e2e8f0;background:#fff;}
.mList.v3 tr.first td{border-top:2px solid #475569;}
.mList.v3 td.d{width:1%;border-right:1px solid #cbd5e1;}
.mList.v3 td.d small{display:block;font-size:11px;font-weight:normal;}
.mList.v3 .tdy{display:inline-block;border:1.5px solid #dc2626;color:#dc2626;border-radius:5px;padding:0 5px;font-size:11px;margin-left:4px;}
.mList.v3 tr.today td{background:#fffbeb;}
.mList.v3 td.co{font-size:15px;min-width:150px;}
.mList.v3 .tgs{margin-top:3px;display:flex;flex-wrap:wrap;gap:4px;}
.mList.v3 .tg{font-size:12px;font-weight:bold;border-radius:4px;padding:1px 6px;white-space:nowrap;}
.mList.v3 .tg.ren{border:1.5px solid #1f2937;color:#1f2937;}
.mList.v3 .tg.stay{background:#1f2937;color:#fff;border:1.5px solid #1f2937;}
.mList.v3 .tg.sub{color:#64748b;font-weight:normal;padding:0;}
.mList.v3 td.time{white-space:nowrap;font-weight:bold;}
.mList.v3 .mi{color:#cbd5e1;}
.mList.v3 .n{text-align:right;white-space:nowrap;font-weight:900;}
.mList.v3 td.nt{width:28%;min-width:160px;font-size:13px;color:#334155;}
.mList.v3 td.lane, .mList.v3 tr.first td.lane{position:relative;padding:0;border-top:none;}
.mList.v3 td.lane i{position:absolute;display:block;}
.mList.v3 td.lane .ln{width:4px;background:#475569;}
.mList.v3 td.lane .dot{top:9px;width:10px;height:10px;border-radius:50%;background:#475569;}
.mList.v3 td.lane .head{bottom:calc(100% - 30px);width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:10px solid #475569;}
.mList.v3 tbody tr:hover td{background:#f8fafc;}
/* 印刷 */
#printArea{display:none;}
.pTitle{font-size:20px;font-weight:900;margin-bottom:6px;}
.pSheet{background:#fff;color:#000;overflow:hidden;display:flex;flex-direction:column;}
.pSheet .kkCal{flex:1;display:flex;flex-direction:column;} .pSheet .kkWeeks{flex:1;} .pSheet .kkWeek{flex:1 0 auto;min-height:0;}
.pSheet.a4{width:281mm;height:192mm;font-size:7.4pt;} .pSheet.a3{width:404mm;height:279mm;font-size:10.5pt;}
.pSheet .kkCal{min-width:0;font-size:inherit;}
.pSheet .kkDow div{font-size:1.15em;padding:.3em 0;}
.pSheet .pTitle{font-size:1.9em;}
.pList .mList{min-width:0;font-size:9pt;} .pList .mList th{position:static;}
@media print{
  body > *:not(#printArea){display:none !important;}
  #printArea{display:block !important;}
  html,body{background:#fff;margin:0 !important;padding:0 !important;min-height:0 !important;height:auto !important;}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .pList .mList tr{break-inside:avoid;}
}
.kkDh.sel{box-shadow:inset 0 0 0 3px #f59e0b;}
.wk{font-size:12px;font-weight:bold;color:#fff;border-radius:6px;padding:1px 7px;}
.wk.all{background:#dc2626;} .wk.A{background:#1976d2;} .wk.B{background:#2e7d32;}
.card{background:#fff;border-radius:14px;box-shadow:0 2px 6px rgba(0,0,0,.08);padding:14px 16px;margin-bottom:10px;border-left:8px solid var(--evb,#14264d);cursor:pointer;}
.card .top{display:flex;align-items:center;gap:8px;font-size:15px;color:#4b5563;font-weight:bold;}
.card .co{font-size:23px;font-weight:900;color:#111;margin:4px 0;line-height:1.3;}
.card .ln{font-size:15px;color:#374151;margin-top:3px;}
.card .ren{color:#c00000;font-weight:bold;}
.card.tent{border-left-style:dashed;background:repeating-linear-gradient(135deg,#fff 0 10px,#f6f7f9 10px 20px);}
.done{background:#16a34a;color:#fff;border-radius:6px;padding:1px 8px;font-size:13px;}
.empty{text-align:center;color:#6b7280;margin:30px 0;font-size:16px;line-height:1.8;}
.fab{position:fixed;right:18px;bottom:18px;width:64px;height:64px;border-radius:50%;background:#14264d;color:#fff;border:none;font-size:32px;box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:60;}

/* 画面(詳細・入力・報告) */
.screen{position:fixed;inset:0;background:#eef1f6;z-index:100;overflow-y:auto;display:none;}
.screen.show{display:block;}
.sHead{background:#14264d;color:#fff;padding:14px 12px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5;}
.sHead h2{font-size:19px;flex:1;}
.sHead button{background:none;border:none;color:#fff;font-size:17px;font-weight:bold;}
.box{background:#fff;border-radius:16px;margin:12px auto;max-width:680px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.08);}
.dCo{font-size:26px;font-weight:900;line-height:1.3;padding:6px 10px;border-left:8px solid var(--evb);background:var(--evbg);border-radius:6px;}
.dDate{font-size:17px;font-weight:bold;color:#14264d;margin:8px 0;}
.dl{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;font-size:17px;margin-top:8px;}
.dl dt{color:#6b7280;font-weight:bold;white-space:nowrap;}
.dl dd{white-space:pre-wrap;word-break:break-all;}
.dl dd.big{font-weight:bold;font-size:18px;}
.dTable{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px;}
.dTable th,.dTable td{border:1px solid #d1d5db;padding:6px;vertical-align:top;text-align:left;}
.dTable th{background:#f3f4f6;white-space:nowrap;}
.dTable tr.cur td{background:#fff7d6;}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;}
.btn{border:none;border-radius:14px;padding:15px 8px;font-size:17px;font-weight:bold;color:#fff;background:#14264d;text-align:center;text-decoration:none;display:block;}
.btn.tel{background:#0f766e;} .btn.map{background:#1a73e8;} .btn.line{background:#06c755;} .btn.rep{background:#ea580c;}
.btn.sub{background:#e5e7eb;color:#111;} .btn.del{background:#fff;color:#dc2626;border:2px solid #fca5a5;}
.btn.full{grid-column:1 / 3;}

/* 入力 */
.f{display:block;font-size:16px;font-weight:bold;margin:16px 0 6px;color:#374151;}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=tel],select,textarea{width:100%;font-size:18px;padding:12px;border:1px solid #9ca3af;border-radius:12px;background:#fff;}
textarea{min-height:70px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.seg{display:flex;flex-wrap:wrap;gap:6px;}
.seg button{flex:1 1 auto;border:2px solid #cbd5e1;background:#f8fafc;border-radius:12px;padding:11px 8px;font-size:16px;font-weight:bold;color:#334155;}
.seg button.on{background:#14264d;border-color:#14264d;color:#fff;}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chips button{border:2px solid #cbd5e1;background:#f8fafc;border-radius:999px;padding:9px 14px;font-size:16px;font-weight:bold;color:#334155;}
.chips button.on{background:#14264d;border-color:#14264d;color:#fff;}
.hint{font-size:13px;color:#6b7280;margin-top:6px;line-height:1.6;}
.price{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:18px;font-weight:bold;}
.price input{width:110px;}
.price .tot{font-size:22px;color:#1d4ed8;}
.sw{display:flex;flex-wrap:wrap;gap:6px;}
.sw button{border:2px solid var(--swb);background:var(--swbg);border-radius:10px;padding:8px 12px;font-size:15px;font-weight:bold;color:#111;}
.sw button.on{box-shadow:0 0 0 3px #14264d;}
.sw button.auto{--swb:#cbd5e1;--swbg:linear-gradient(90deg,#FFF6D5,#E8F4E0,#E3EEF9,#FCE8EF);}
.per{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px;}
.per th,.per td{border:1px solid #d1d5db;padding:4px;}
.per input{font-size:15px;padding:7px;}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;color:#dc2626;font-weight:bold;grid-column:1 / 3;}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#16a34a;color:#fff;padding:14px 20px;border-radius:14px;font-weight:bold;font-size:16px;z-index:300;max-width:92%;text-align:center;display:none;}
.toast.show{display:block;} .toast.err{background:#dc2626;}
</style>
<style id="pageStyle"></style>
</head>
<body>
<div class="toast" id="toast"></div>

<header>
  <div class="row">
    <h1>🚜 機械作業 <small style="font-size:11px;opacity:.6;font-weight:normal;">版 10/19-9</small></h1>
    <button class="instBtn" id="instBtn" onclick="installApp()">📲 ホームに追加</button>
    <select class="me" id="me" onchange="setMe(this.value)" aria-label="自分の名前" hidden><option value="">👤 自分の名前を選ぶ</option></select>
  </div>
  <div class="tabs">
    <button id="tab-cal" onclick="setTab('cal')">📅 カレンダー</button>
    <button id="tab-today" onclick="setTab('today')">今日</button>
    <button id="tab-list" onclick="setTab('list')">📋 1か月の一覧</button>
  </div>
</header>
<div class="wrap" id="list"></div>
<button class="fab" onclick="openForm(null)" aria-label="機械作業を追加">＋</button>

<!-- 詳細(作業指示書) -->
<div class="screen" id="detail">
  <div class="sHead"><button onclick="closeScreen('detail')">← 戻る</button><h2>作業指示書</h2></div>
  <div class="box" id="detailBody"></div>
</div>

<!-- 作業報告 -->
<div class="screen" id="report">
  <div class="sHead"><button onclick="closeScreen('report')">← 戻る</button><h2>作業報告</h2></div>
  <div class="box">
    <div class="dCo" id="rpCo"></div>
    <div class="dDate" id="rpDate"></div>
    <label class="f">この日の作業</label>
    <div class="seg" id="rpDone">
      <button type="button" data-v="done" onclick="seg('rpDone',this)">✅ 終わった</button>
      <button type="button" data-v="cont" onclick="seg('rpDone',this)">⏳ 続きあり</button>
      <button type="button" data-v="ng" onclick="seg('rpDone',this)">⚠️ できなかった</button>
    </div>
    <div class="row2">
      <div><label class="f">始めた時刻</label><input type="time" id="rpStart"></div>
      <div><label class="f">終わった時刻</label><input type="time" id="rpEnd"></div>
    </div>
    <label class="f">報告・気づいたこと</label>
    <textarea id="rpNote" rows="4" placeholder="例:搬出完了。床の養生が必要だった。次回はパレット2枚追加。"></textarea>
    <label class="f">報告する人</label>
    <select id="rpBy"></select>
    <div class="acts">
      <button class="btn rep full" onclick="saveReport()">📝 報告を保存</button>
      <button class="btn sub full" onclick="closeScreen('report')">やめる</button>
    </div>
  </div>
</div>

<!-- 入力(関根カレンダーの機械作業と同じ項目・同じ並び) -->
<div class="screen" id="form">
  <div class="sHead"><button onclick="closeScreen('form')">← 戻る</button><h2 id="fTitle">機械作業を追加</h2></div>
  <div class="box">
    <div class="hint" style="background:#e8ecf4;border-radius:10px;padding:10px;color:#14264d;">📅 ここで入れた予定は、関根カレンダー(機械作業・通常カレンダーの「機械移動」)にもそのまま出ます。</div>
    <label class="f">種類</label>
    <div class="seg" id="kind">
      <button type="button" data-v="fixed" onclick="setKind('fixed')">日程が決まっている</button>
      <button type="button" data-v="tent" onclick="setKind('tent')">日程未定(仮)</button>
    </div>

    <div class="row2">
      <div><label class="f" id="lStart">開始日</label><input type="date" id="fStart" onchange="startChanged()"></div>
      <div><label class="f" id="lEnd">終了日</label><input type="date" id="fEnd" onchange="renderPer()"></div>
    </div>
    <div class="tentOnly"><label class="f">作業日数</label><input type="text" id="fTdays" placeholder="例:2日間"></div>

<script>
/* ===== Firebase読み取り節約(通信の自動休止・再開) 2026-10 =====
   ・画面が見えていない(別タブ・最小化・スマホのスリープ)状態が5分続いたら、リアルタイム監視を止めます
     → 画面に戻ると自動で再開します
   ・夜間(19時〜翌6時)は、30分さわらなければ休止します(モニター出しっぱなし対策)
     → 画面をタップすると再開、朝6時には自動で再開します
   ※このブロックは全アプリ共通です。時間を変えるときは下の数字だけ変えてください */
(function(){
  if(!window.firebase || !firebase.firestore) return;
  var NIGHT_FROM = 19;              // 夜間休止の開始(時)
  var NIGHT_TO   = 6;               // 夜間休止の終了(時)
  var HIDDEN_WAIT = 5*60*1000;      // 見えなくなってから休止するまで(5分)
  var NIGHT_IDLE  = 30*60*1000;     // 夜間、さわらずに休止するまで(30分)

  var subs = [], paused = false, reason = '', hiddenTimer = null, lastInput = Date.now(), overlay = null;
  function isNight(){ var h = new Date().getHours(); return h >= NIGHT_FROM || h < NIGHT_TO; }
  function isVisible(){ return document.visibilityState !== 'hidden'; }

  // onSnapshot(リアルタイム監視)を、止めたり再開したりできる形に包む
  function wrap(proto){
    if(!proto) return;
    var orig = proto.onSnapshot;
    if(!orig || orig.__fsSaver) return;
    var w = function(){
      var s = { ref:this, args:Array.prototype.slice.call(arguments), unsub:null, dead:false };
      s.start = function(){ if(!s.dead && !s.unsub) s.unsub = orig.apply(s.ref, s.args); };
      s.stop  = function(){ if(s.unsub){ try{ s.unsub(); }catch(e){} s.unsub = null; } };
      subs.push(s);
      if(!paused) s.start();
      return function(){ s.dead = true; s.stop(); var i = subs.indexOf(s); if(i >= 0) subs.splice(i, 1); };
    };
    w.__fsSaver = true;
    proto.onSnapshot = w;
  }
  wrap(firebase.firestore.Query && firebase.firestore.Query.prototype);
  wrap(firebase.firestore.CollectionReference && firebase.firestore.CollectionReference.prototype);
  wrap(firebase.firestore.DocumentReference && firebase.firestore.DocumentReference.prototype);

  function showOverlay(){
    if(!document.body) return;
    if(!overlay){
      overlay = document.createElement('div');
      overlay.id = 'fsSaverOverlay';
      overlay.setAttribute('style', 'position:fixed;inset:0;z-index:2147483000;background:rgba(15,23,42,.72);display:flex;align-items:center;justify-content:center;padding:16px;cursor:pointer;');
      overlay.innerHTML = '<div style="background:#fff;color:#1f2937;border-radius:16px;padding:24px 22px;max-width:420px;width:100%;text-align:center;font-family:sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.3);">'
        + '<div style="font-size:42px;line-height:1;">💤</div>'
        + '<div style="font-size:20px;font-weight:bold;margin:10px 0 8px;">通信を休止しています</div>'
        + '<div style="font-size:14px;line-height:1.7;color:#4b5563;">夜間(' + NIGHT_FROM + '時〜翌' + NIGHT_TO + '時)は、Firebaseの無料枠を節約するため自動で休止します。<br>朝' + NIGHT_TO + '時に自動で再開します。</div>'
        + '<div style="margin-top:16px;background:#16a34a;color:#fff;border-radius:999px;padding:12px;font-size:16px;font-weight:bold;">👆 タップして再開</div>'
        + '</div>';
      document.body.appendChild(overlay);
    }
    overlay.style.display = 'flex';
  }
  function hideOverlay(){ if(overlay) overlay.style.display = 'none'; }

  function pause(why){
    if(paused) return;
    paused = true; reason = why;
    subs.forEach(function(s){ s.stop(); });
    if(why === 'night') showOverlay();
  }
  function resume(byTap){
    lastInput = Date.now();
    if(!paused) return;
    paused = false; reason = '';
    // タップで再開したときは、そのタップが下のボタンに届かないよう少し待ってから幕を外す
    if(byTap) setTimeout(hideOverlay, 500); else hideOverlay();
    subs.forEach(function(s){ s.start(); });
  }

  // 画面の表示・非表示
  document.addEventListener('visibilitychange', function(){
    if(isVisible()){
      if(hiddenTimer){ clearTimeout(hiddenTimer); hiddenTimer = null; }
      resume(false);
    }else if(!hiddenTimer){
      hiddenTimer = setTimeout(function(){ hiddenTimer = null; if(!isVisible()) pause('hidden'); }, HIDDEN_WAIT);
    }
  });

  // さわったら「使っている」とみなす(休止中なら再開)
  ['pointerdown','touchstart','keydown','wheel'].forEach(function(ev){
    window.addEventListener(ev, function(e){
      if(paused && reason === 'night'){ resume(true); return; }
      lastInput = Date.now();
    }, { capture:true, passive:true });
  });

  // 1分ごとに夜間・朝の判定
  setInterval(function(){
    if(!isVisible()) return;
    if(!paused && isNight() && Date.now() - lastInput > NIGHT_IDLE) pause('night');
    else if(paused && reason === 'night' && !isNight()) resume(false);
  }, 60*1000);

  // 確認用(ブラウザのコンソールで fsSaver.status() と打つと状態が見られます)
  window.fsSaver = {
    status: function(){ return { paused:paused, reason:reason, listeners:subs.length }; },
    pause: function(){ pause('night'); },
    resume: function(){ resume(false); }
  };
})();
</script>

/* ---------- 祝日・A休B休 ---------- */
const holCache = {};
function nth(y,m,wd,n){ const f = new Date(y,m-1,1).getDay(); return 1+((wd-f+7)%7)+(n-1)*7; }
function holidaysOf(y){
  if (holCache[y]) return holCache[y];

function kindOf(ev){ return (ev.kind==="machine"||ev.kind==="other") ? "machine" : ev.kind==="jomu" ? "jomu" : "regular"; }

  if (!ev.date || ds < ev.date) return false;

/* 表示する範囲の作業を、連続した日ごとのかたまりにする(同じ会社を1日ずつ入れた予定もつなげる) */

function evOf(j, ds){ return (j.evByDay && j.evByDay[ds]) || j.ev; }

/* 関根カレンダーの「機械作業」と同じ形の月の表(月曜はじまり・会社名の横に期間の矢印) */
function mWeeks(y, m0){
  const first = new Date(y, m0, 1), last = new Date(y, m0+1, 0).getDate();
  const off = (first.getDay()+6)%7, start = ymd(new Date(y, m0, 1-off));
  const n = Math.ceil((off+last)/7), weeks = [];

}
const mIn = (ds, y, m0) => { const d = parseYmd(ds); return d.getFullYear() === y && d.getMonth() === m0; };
function mSegs(week, y, m0, list){
  const vis = week.filter(d => mIn(d, y, m0)); if (!vis.length) return { segs:[], lanes:0 };
  const a = vis[0], b = vis[vis.length-1], segs = [];
  list.forEach(j => {
    if (j.end < a || j.start > b) return;
    const s0 = j.start > a ? j.start : a, s1 = j.end < b ? j.end : b;
    segs.push({ j, s0, s1, c0:week.indexOf(s0), c1:week.indexOf(s1), fromPrev:s0 > j.start, toNext:s1 < j.end });
  });
  segs.sort((p,q) => (p.j.tent-q.j.tent) || ((q.c1-q.c0)-(p.c1-p.c0)) || (p.c0-q.c0));
  const lanes = [];
  segs.forEach(sg => { let li = lanes.findIndex(l => l.every(o => sg.c1 < o.c0 || sg.c0 > o.c1)); if (li < 0){ lanes.push([]); li = lanes.length-1; } lanes[li].push(sg); sg.lane = li; });
  return { segs, lanes:lanes.length };
}

        (nl ? '<td class="lane" style="width:'+(nl*13+8)+'px">'+laneHtml(r, i)+'</td>' : '')+

        cols.map(([k]) => '<td class="'+k+'">'+esc(r[k]||"")+'</td>').join("")+

    if (cal.offsetHeight > sh.clientHeight + 1){ const k = sh.clientHeight / cal.offsetHeight; cal.style.transformOrigin = "0 0"; cal.style.transform = "scale("+k+")"; cal.style.width = (100/k)+"%"; }
    else { cal.style.flex = ""; cal.style.height = ""; }   // 余ったら紙の下まで広げる
  });
}

/* ---------- PDF(画像にしてPDFに) ---------- */
const LIB = { xl:"https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js", h2c:"https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js", pdf:"https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" };
const libLoaded = {};
function loadLib(u){ return libLoaded[u] || (libLoaded[u] = new Promise((ok, ng) => { const sc = document.createElement("script"); sc.src = u; sc.onload = ok; sc.onerror = () => { delete libLoaded[u]; ng(new Error("読み込めませんでした")); }; document.head.appendChild(sc); })); }
function saveBlob(blob, name){ const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }
async function makePdf(html, paper, name, multi){
  toast("📄 PDFを作っています…");
  try {
    await Promise.all([loadLib(LIB.h2c), loadLib(LIB.pdf)]);
    const box = $("pdfArea"); box.innerHTML = html; fitSheets(box);
    const el = box.firstElementChild;
    const cv = await html2canvas(el, { scale:2, backgroundColor:"#fff" });
    box.innerHTML = "";
    const doc = new jspdf.jsPDF({ orientation:"landscape", unit:"mm", format:paper.toLowerCase() });
    const pw = doc.internal.pageSize.getWidth() - 14, ph = doc.internal.pageSize.getHeight() - 14;
    const w = pw, h = cv.height * w / cv.width;
    if (!multi || h <= ph){ const k = Math.min(1, ph / h); doc.addImage(cv.toDataURL("image/jpeg", .92), "JPEG", 7, 7, w*k, h*k); }
    else {   // 長い一覧はページに分ける
      const pagePx = Math.floor(cv.width * ph / pw);
      for (let y = 0, i = 0; y < cv.height; y += pagePx, i++){
        const c = document.createElement("canvas"); c.width = cv.width; c.height = Math.min(pagePx, cv.height - y);
        c.getContext("2d").drawImage(cv, 0, y, cv.width, c.height, 0, 0, cv.width, c.height);
        if (i) doc.addPage();
        doc.addImage(c.toDataURL("image/jpeg", .92), "JPEG", 7, 7, w, c.height * w / cv.width);
      }
    }
    saveBlob(doc.output("blob"), name);
    toast("📄 "+name+" を保存しました");
  } catch(e){ console.error(e); toast("PDFを作れませんでした(通信を確かめてください)", true); }
}

  const keep = {}; body.querySelectorAll("tr[data-d]").forEach(tr => { keep[tr.dataset.d] = {
    work:tr.querySelector('[data-k="work"]').value, equip:tr.querySelector('[data-k="equip"]').value, people:tr.querySelector('[data-k="people"]').value }; });
  if (!s || !e || e < s){ body.innerHTML = '<tr><td colspan="4">開始日と終了日を入れてください</td></tr>'; return; }
  const src = Object.assign({}, (edit && edit.ev && edit.ev.daysDetail) || {}, keep);
  body.innerHTML = each(s, e).map(d => { const o = src[d] || {};
    return '<tr data-d="'+d+'"><th>'+esc(mdw(d))+'</th><td><input type="text" data-k="work" value="'+esc(o.work||"")+'"></td>'+
      '<td><input type="text" data-k="equip" value="'+esc(o.equip||"")+'"></td><td><input type="text" data-k="people" value="'+esc(o.people||"")+'" style="width:4.5em"></td></tr>'; }).join("");
}
function openForm(ref, ds){
  $("clientList").innerHTML = clients.map(c => '<option value="'+esc(c.name)+'">').join("");
  const isT = ref && String(ref).startsWith("t:");
  const t = isT ? tents.find(x => x.id === ref.slice(2)) : null;
  const ev = (!isT && ref) ? events.find(e => e.id === ref) : null;
  const day = ds || todayYmd();
  const start = ev ? ev.date : t ? t.start : day, end = ev ? (ev.period ? ev.endDate : ev.date) : t ? t.end : day;
  edit = ev ? { type:"ev", id:ev.id, ev, days:each(start, end) } : t ? { type:"tent", id:t.id } : null;
  $("fTitle").textContent = ev || t ? "機械作業を直す" : "機械作業を追加";
  setKind(t ? "tent" : "fixed");
  $("fStart").value = start; $("fEnd").value = end;
  setSegVal("fAp", ev ? (ev.timeText ? "time" : (ev.ampm||"")) : ""); $("fTime").value = ev ? (ev.timeText||"") : "";
  $("fName").value = ev ? (ev.title||"") : t ? (t.title||"") : "";
  $("fWork").value = ev ? (ev.work||"") : t ? (t.work||"") : "";
  $("fPlace").value = ev ? (ev.place||ev.placeFrom||"") : t ? (t.place||"") : "";
  $("fDest").value = ev ? (ev.placeTo||"") : t ? (t.dest||"") : "";
  $("fRoute").value = ev ? (ev.routeNote||"") : "";
  setTimeout(routePreview, 0);
  $("fContact").value = ev ? (ev.contact||"") : ""; $("fTel").value = ev ? (ev.tel||"") : "";
  $("fEquip").value = ev ? (ev.equip||"") : ""; $("fItems").value = ev ? (ev.kikaiItems||"") : "";
  $("fPeople").value = ev ? (ev.people||"") : "";
  $("fNights").value = String(ev ? (ev.nights||0) : 0); $("fHotel").value = ev ? (ev.hotel||"") : "";
  $("fHotelCost").value = ev ? (costOf(ev) || "") : ""; $("fHotelTel").value = ev ? (ev.hotelTel||"") : "";
  $("fTdays").value = t ? (t.tdays||"") : ""; $("fMemo").value = ev ? (ev.memo||"") : t ? (t.memo||"") : "";
  pickColor(document.querySelector('#fColor button[data-c="'+(ev && Number.isInteger(ev.color) ? ev.color : "")+'"]'));
  const g0 = ev ? ((ev.goersByDate||{})[start]||[]) : (me ? [me] : []), t0 = ev ? ((ev.trucksByDate||{})[start]||[]) : [];
  if (edit){ edit.g0 = g0.slice(); edit.t0 = t0.slice(); }
  chips("fWorkers", staff, g0); chips("fTrucks", trucks, t0);
  $("fPerOn").checked = !!(ev && ev.daysDetail && Object.keys(ev.daysDetail).length);
  $("fPerBody").innerHTML = ""; renderPer();
  $("fDel").hidden = !edit; $("fDelOk").hidden = true;
  placeUi(); calcPrice();
  closeScreen("detail"); openScreen("form");
}
const sameSet = (a,b) => a.length === b.length && a.every(x => b.includes(x));
async function saveForm(){
  const tent = segVal("kind") === "tent";
  const title = gv("fName").trim(), s = gv("fStart"), e = gv("fEnd") || s;
  if (!s){ toast("日付を入れてください", true); return; }
  if (e < s){ toast("終了日が開始日より前です", true); return; }
  if (!tent && !title){ toast("会社名を入れてください", true); return; }
  const btn = $("fSave"); btn.disabled = true;
  try {
    if (tent){
      const data = { title, start:s, end:e, tdays:gv("fTdays").trim(), work:gv("fWork").trim(), place:gv("fPlace").trim(), dest:gv("fDest").trim(), memo:gv("fMemo").trim(), updatedAt:FV().serverTimestamp() };
      if (edit && edit.type === "tent") await db.collection(TENT_COL).doc(edit.id).update(data);
      else { await db.collection(TENT_COL).add({ ...data, createdAt:FV().serverTimestamp() }); if (edit && edit.type === "ev") await db.collection(EVENT_COL).doc(edit.id).delete(); }
    } else {
      const ap = segVal("fAp"), tt = ap === "time" ? gv("fTime") : "";
      if (ap === "time" && !tt){ toast("時刻を入れてください", true); btn.disabled = false; return; }
      const days = each(s, e), period = e > s, goers = picked("fWorkers"), trs = picked("fTrucks");
      const daysDetail = {};
      if ($("fPerOn").checked) document.querySelectorAll("#fPerBody tr[data-d]").forEach(tr => { const o = {};
        tr.querySelectorAll("input").forEach(i => { if (i.value.trim()) o[i.dataset.k] = i.value.trim(); }); if (Object.keys(o).length) daysDetail[tr.dataset.d] = o; });
      const cb = document.querySelector("#fColor button.on"), cv = cb ? cb.dataset.c : "", m = clientOf(title);
      const data = { kind:"machine", title, clientId:m ? m.id : "", work:gv("fWork").trim(), date:s,
        ampm: ap === "time" ? (Number(tt.slice(0,2)) < 12 ? "午前" : "午後") : ap, timeText:tt,
        place:gv("fPlace").trim(), placeFrom:"", placeTo:gv("fDest").trim(), routeNote:gv("fRoute").trim(), kikaiItems:gv("fItems").trim(), contact:gv("fContact").trim(), tel:gv("fTel").normalize("NFKC").trim(),
        hotelCost:Number(gv("fHotelCost"))||0, hotelTel:gv("fHotelTel").normalize("NFKC").trim(), hpPeople:0, hpUnit:0, hotelPrice:"",
        repeat: period ? "weekly" : "none", wdays: period ? ALL_WD.slice() : [], endDate: period ? e : "", period,
        equip:gv("fEquip").trim(), people:gv("fPeople").trim(), nights:Number(gv("fNights"))||0, hotel:gv("fHotel").trim(),
        color: cv === "" ? null : Number(cv), memo:gv("fMemo").trim(), daysDetail, updatedAt:FV().serverTimestamp() };
      if (edit && edit.type === "ev"){
        const old = edit.days, gCh = !sameSet(goers, edit.g0), tCh = !sameSet(trs, edit.t0);
        days.forEach(d => { if (gCh || !old.includes(d)) data["goersByDate."+d] = goers; if (tCh || !old.includes(d)) data["trucksByDate."+d] = trs; });
        old.filter(d => !days.includes(d)).forEach(d => { data["goersByDate."+d] = FV().delete(); data["trucksByDate."+d] = FV().delete(); });
        await db.collection(EVENT_COL).doc(edit.id).update(data);
      } else {
        const gb = {}, tb = {}; days.forEach(d => { if (goers.length) gb[d] = goers; if (trs.length) tb[d] = trs; });
        await db.collection(EVENT_COL).add({ ...data, yomi:(m && m.yomi) || "", skipDates:[], doneDates:[], missedDates:[], goersByDate:gb, trucksByDate:tb, createdAt:FV().serverTimestamp() });
        if (edit && edit.type === "tent") await db.collection(TENT_COL).doc(edit.id).delete();
      }
    }
    closeScreen("form"); toast("✅ 保存しました。関根カレンダーにも出ます");
  } catch(err){ console.error(err); toast("⚠️ 保存できませんでした。電波のよいところでもう一度押してください", true); }
  finally { btn.disabled = false; }
}
function askDel(on){ $("fDelOk").hidden = !on; $("fDel").hidden = on; }
async function doDelete(){
  if (!edit) return;
  try { await db.collection(edit.type === "tent" ? TENT_COL : EVENT_COL).doc(edit.id).delete(); closeScreen("form"); toast("消しました"); }
  catch(err){ console.error(err); toast("⚠️ 消せませんでした", true); }
}

/* ---------- データの読み込み ---------- */
db.collection(EVENT_COL).onSnapshot(snap => { events = snap.docs.map(d => ({ id:d.id, ...d.data() })); render(); }, e => { console.error(e); toast("⚠️ 予定を読めませんでした", true); });
db.collection(TENT_COL).onSnapshot(snap => { tents = snap.docs.map(d => ({ id:d.id, ...d.data() })); render(); }, e => console.error(e));
db.collection("employees").get().then(snap => {
  staff = snap.docs.map(d => d.data()).filter(x => x.name).sort((a,b) => (a.order ?? 999) - (b.order ?? 999)).map(x => x.name);
  $("me").innerHTML = '<option value="">👤 自分の名前を選ぶ</option>'+staff.map(n => '<option'+(n === me ? ' selected' : '')+'>'+esc(n)+'</option>').join("");
  fillReporter(); render();
}).catch(e => console.error(e));
db.collection("master_vehicles").onSnapshot(snap => {
  const a = []; snap.docs.forEach(d => { const v = d.data(), n = String(v.nickname || v.number || "").trim(); if (n && !a.includes(n)) a.push(n); });
  trucks = a.sort((x,y) => x.localeCompare(y, "ja", { numeric:true }));
}, e => console.error(e));
db.collection("master_clients").get().then(snap => { clients = snap.docs.map(d => ({ id:d.id, ...d.data() })).filter(c => c.name); render(); }).catch(e => console.error(e));
db.collection("workCalendars").where("owner","==","sekine").onSnapshot(snap => { workCals = snap.docs.map(d => d.data()); render(); }, e => console.error(e));

/* 日付が変わったら「今日」を切り替える */
let lastDay = todayYmd();
setInterval(() => { const t = todayYmd(); if (t !== lastDay){ lastDay = t; render(); } }, 60000);
render();

            : "ブラウザのメニュー(右上の︙)から「ホーム画面に追加」または「アプリをインストール」を選んでください。");
}
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("service-worker.js").catch(() => {}));
